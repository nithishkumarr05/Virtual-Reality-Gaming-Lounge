<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign Up · VR Galaxy — Virtual Reality Gaming Lounge</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E" type="image/svg+xml">

    <!-- Tailwind CSS -->
     <script src="tailwind.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'vr': {
                            'dark': '#050510',
                            'panel': '#0B0C1B',
                            'primary': '#8B5CF6',
                            'secondary': '#22D3EE',
                            'accent': '#F43F5E',
                            'text': '#F8FAFC',
                            'muted': '#94A3B8',
                        }
                    },
                    fontFamily: {
                        'display': ['Orbitron', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                    }
                }
            }
        }
    </script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        html, body { overflow-x: hidden; max-width: 100%; }
        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050510;
            color: #F8FAFC;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Inter', system-ui, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            background-image: radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.1) 0%, transparent 60%);
        }

        /* Theme toggles — top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }

        .toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(139, 92, 246, 0.15);
            color: #22D3EE;
            transition: all 0.3s ease;
            border: 1px solid rgba(34, 211, 238, 0.3);
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .toggle-btn:hover {
            transform: scale(1.08);
            background: #8B5CF6;
            color: #FFFFFF;
        }

        /* Signup Card */
        .signup-card {
            background: rgba(11, 12, 27, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 36px;
            padding: 1.8rem 2rem 1.8rem;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        /* Input styling */
        .signup-input {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 3rem;
            border-radius: 50px;
            border: 1.5px solid rgba(139, 92, 246, 0.3);
            background: #050510;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
        }

        .signup-input:focus {
            outline: none;
            border-color: #22D3EE;
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
        }

        .signup-input::placeholder {
            color: #64748B;
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .signup-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #22D3EE;
            font-size: 0.95rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #FFFFFF;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .signup-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* Primary button */
        .btn-neon {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: #FFFFFF;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.8);
        }

        /* Social login buttons */
        .social-btn {
            flex: 1;
            padding: 0.7rem 0.5rem;
            border-radius: 50px;
            border: 1.5px solid rgba(139, 92, 246, 0.3);
            background: #0B0C1B;
            color: #F8FAFC;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .social-btn:hover {
            background: rgba(34, 211, 238, 0.1);
            border-color: #22D3EE;
            transform: translateY(-2px);
        }

        .social-btn i {
            font-size: 1.1rem;
            color: #22D3EE;
        }

        /* Logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .welcome-title {
            font-family: 'Orbitron', serif;
            font-size: 1.7rem;
            font-weight: 800;
            color: #FFFFFF;
            margin-top: 1.25rem;
            margin-bottom: 0.1rem;
            text-align: center;
            line-height: 1.2;
        }

        .welcome-subtitle {
            font-size: 0.85rem;
            color: #94A3B8;
            text-align: center;
            margin-bottom: 0.25rem;
            font-weight: 400;
            opacity: 0.8;
        }

        /* Terms text */
        .terms-text {
            font-size: 0.7rem;
            color: #94A3B8;
        }

        .terms-link {
            color: #22D3EE;
            font-weight: 600;
            text-decoration: none;
        }

        .terms-link:hover {
            text-decoration: underline;
            color: #FFFFFF;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1rem 0 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        }

        .divider span {
            font-size: 0.7rem;
            padding: 0 0.8rem;
            color: #94A3B8;
            font-weight: 600;
            opacity: 0.7;
        }

        .custom-checkbox {
            accent-color: #8B5CF6;
        }

        a {
            transition: all 0.2s ease;
        }

        /* Background decorative glow */
        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow-left {
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        /* Responsive */
        @media (max-height: 650px) {
            .signup-card { padding: 0.8rem 1.5rem; transform: scale(0.94); transform-origin: center; }
            .logo-center { margin-bottom: 0.3rem; }
            .welcome-title { font-size: 1.2rem; margin-top: 0.25rem; }
            .welcome-subtitle { font-size: 0.75rem; margin-bottom: 0.15rem; }
            .signup-input { padding: 0.5rem 0.8rem 0.5rem 2.5rem; font-size: 0.8rem; }
            .btn-neon { padding: 0.5rem 1rem; font-size: 0.85rem; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.8rem; }
            .divider { margin: 0.6rem 0; }
            .social-btn { padding: 0.4rem 0.5rem; font-size: 0.75rem; }
        }

        @media (max-width: 380px) {
            .signup-card { padding: 1.2rem 1.2rem; border-radius: 24px; }
            .welcome-title { font-size: 1.2rem; }
            .signup-input { padding: 0.6rem 0.8rem 0.6rem 2.6rem; font-size: 0.8rem; }
            .social-btn { padding: 0.4rem 0.3rem; font-size: 0.75rem; gap: 0.3rem; }
            .social-btn i { font-size: 0.9rem; }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; right: auto; }
        }
    
        /* Light Theme Overrides */
        html:not(.dark) body {
            background-color: #F8FAFC !important;
            color: #0F172A !important;
            background-image: radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 60%) !important;
        }
        html:not(.dark) .login-card,
        html:not(.dark) .signup-card {
            background: rgba(255, 255, 255, 0.95) !important;
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.1) !important;
            border-color: rgba(139, 92, 246, 0.2) !important;
        }
        html:not(.dark) .welcome-title,
        html:not(.dark) .form-label,
        html:not(.dark) .strength-text,
        html:not(.dark) .terms-text {
            color: #0F172A !important;
        }
        html:not(.dark) .welcome-subtitle {
            color: #64748B !important;
        }
        html:not(.dark) .login-input,
        html:not(.dark) .signup-input {
            background: #F1F5F9 !important;
            border-color: rgba(139, 92, 246, 0.2) !important;
            color: #0F172A !important;
        }
        html:not(.dark) .login-input:focus,
        html:not(.dark) .signup-input:focus {
            background: #FFFFFF !important;
            border-color: #8B5CF6 !important;
        }
        html:not(.dark) .input-icon {
            color: #64748B !important;
        }
        html:not(.dark) .divider::before,
        html:not(.dark) .divider::after {
            border-color: #E2E8F0 !important;
        }
        html:not(.dark) .divider span {
            color: #94A3B8 !important;
        }
        html:not(.dark) .logo-center span.text-white {
            color: #0F172A !important;
        }
        html:not(.dark) .logo-center .fa-vr-cardboard {
            color: #FFFFFF !important;
        }
        html:not(.dark) .terms-link {
            color: #0891B2 !important;
        }
        html:not(.dark) .text-vr-muted {
            color: #64748B !important;
        }
        html:not(.dark) .bg-vr-panel {
            background-color: #FFFFFF !important;
        }
        html:not(.dark) .toggle-password {
            color: #475569 !important;
        }
        html:not(.dark) .btn-google,
        html:not(.dark) .btn-discord,
        html:not(.dark) .social-btn {
            background: #F1F5F9 !important;
            border-color: #CBD5E1 !important;
            color: #0F172A !important;
        }
        html:not(.dark) .social-btn:hover {
            background: #E0F2FE !important;
            border-color: #0891B2 !important;
        }
        html:not(.dark) .social-btn i {
            color: #0891B2 !important;
        }
        html:not(.dark) .toggle-btn {
            background: #F1F5F9 !important;
            color: #7C3AED !important;
            border-color: rgba(139, 92, 246, 0.2) !important;
        }

    </style>
</head>

<body>

    <!-- Background Glows -->
    <div class="bg-glow"></div>
    <div class="bg-glow-left"></div>

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            <i class="fas fa-exchange-alt"></i>
        </button>
    </div>

    <!-- ===== SIGNUP CARD ===== -->
    <div class="container-tight relative z-10">
        <div class="signup-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center">
                <a href="index.html" class="flex items-center gap-3 group shrink-0 transition-transform duration-200 hover:scale-[1.02] inline-flex">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shrink-0" style="background:linear-gradient(135deg,#8B5CF6,#22D3EE);">
                        <i class="fas fa-vr-cardboard text-xl text-white"></i>
                    </div>
                    <div class="flex flex-col text-left leading-none">
                        <span class="font-display text-xl font-bold tracking-wider text-white">
                            VR <span class="text-vr-secondary">GALAXY</span>
                        </span>
                        <span class="text-[9px] tracking-widest uppercase font-semibold text-vr-muted mt-0.5">Gaming Lounge</span>
                    </div>
                </a>

                <h1 class="welcome-title">Create Account</h1>
                <p class="welcome-subtitle">Join the ultimate VR experience</p>
            </div>

            <!-- ===== SIGNUP FORM ===== -->
            <form id="signupForm" class="space-y-3.5">

                <!-- Full Name -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-vr-secondary input-icon">
                        <i class="fas fa-user w-4 text-sm"></i>
                    </span>
                    <input type="text" id="fullName" name="name" placeholder="Full name" required
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- Email -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-vr-secondary input-icon">
                        <i class="fas fa-envelope w-4 text-sm"></i>
                    </span>
                    <input type="email" id="email" name="email" placeholder="Email address" required
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- Password with eye -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-vr-secondary input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-password" name="password" placeholder="Password" required
                        class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Confirm Password with eye -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-vr-secondary input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-confirm-password" name="confirm_password"
                        placeholder="Confirm password" required class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-confirm-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Terms -->
                <div class="flex items-start space-x-2 rtl:space-x-reverse mt-1">
                    <input type="checkbox" id="terms"
                        class="mt-0.5 rounded border-vr-primary/30 custom-checkbox"
                        required>
                    <label for="terms" class="terms-text">
                        I agree to the <a href="#" class="terms-link" id="termsLink">Terms of Service</a> and
                        <a href="#" class="terms-link" id="privacyLink">Privacy Policy</a>
                    </label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-neon mt-1">
                    Create Account <i class="fas fa-user-plus ml-2"></i>
                </button>
            </form>

            <!-- ===== Divider + Social ===== -->
            <div class="divider">
                <span>or sign up with</span>
            </div>

            <div class="flex gap-3">
                <button class="social-btn" id="googleSignupBtn">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="social-btn" id="discordSignupBtn">
                    <i class="fab fa-discord"></i>
                    <span>Discord</span>
                </button>
            </div>

            <!-- ===== LOGIN LINK ===== -->
            <div class="mt-4 text-center">
                <span class="text-xs text-vr-muted">Already a VR Galaxy member?</span>
                <a href="login.html"
                    class="text-xs font-semibold text-vr-secondary ml-1 rtl:mr-1 hover:underline">
                    Sign in
                </a>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Theme Toggle (Design is primarily dark, toggle class for slight variation)
            const themeBtn = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                const moon = themeBtn?.querySelector('.fa-moon');
                const sun = themeBtn?.querySelector('.fa-sun');
                if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
                else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            // Default to dark mode if no preference saved
            const savedTheme = localStorage.getItem('theme');
            setTheme(savedTheme ? savedTheme === 'dark' : true);

            // 2. RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
                localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
                localStorage.setItem('direction', isRTL ? 'rtl' : 'ltr');
            }

            const savedDir = localStorage.getItem('direction') || localStorage.getItem('dir');
            setRTL(savedDir === 'rtl');

            if (rtlBtn) {
                rtlBtn.addEventListener('click', () => {
                    setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
                });
            }

            // 3. Password Toggle
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-eye-slash');
                            icon.classList.toggle('fa-eye');
                        }
                    }
                });
            });

            // 4. Social signup placeholders
            document.getElementById('googleSignupBtn').addEventListener('click', function() {
                alert('Sign up with Google — coming soon. For now, use the demo form.');
            });
            document.getElementById('discordSignupBtn').addEventListener('click', function() {
                alert('Sign up with Discord — coming soon. For now, use the demo form.');
            });

            // 5. Demo signup — redirect to customer dashboard
            document.getElementById('signupForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const password = document.getElementById('signup-password').value;
                const confirm = document.getElementById('signup-confirm-password').value;
                if (password !== confirm) {
                    alert('Passwords do not match. Please try again.');
                    return;
                }
                if (!document.getElementById('terms').checked) {
                    alert('Please agree to the Terms of Service and Privacy Policy.');
                    return;
                }
                // Redirect to customer dashboard
                window.location.href = 'customer.html';
            });

            // 6. Terms & Privacy links
            document.getElementById('termsLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Terms of Service — coming soon.');
            });
            document.getElementById('privacyLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Privacy Policy — coming soon.');
            });
        });
    </script>

</body>
</html>
