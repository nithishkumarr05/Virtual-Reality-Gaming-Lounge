<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign In · VR Galaxy — Virtual Reality Gaming Lounge</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E" type="image/svg+xml">

    <!-- Tailwind CSS -->
     <script src="tailwind.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'vr': {
                            'dark': '#050510',
                            'panel': '#0B0C1B',
                            'primary': '#8B5CF6',
                            'secondary': '#22D3EE',
                            'accent': '#F43F5E',
                            'text': '#F8FAFC',
                            'muted': '#94A3B8',
                        }
                    },
                    fontFamily: {
                        'display': ['Orbitron', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                        pulseGlow: { '0%, 100%': { boxShadow: '0 0 20px rgba(139, 92, 246, 0.4)' }, '50%': { boxShadow: '0 0 40px rgba(139, 92, 246, 0.8)' } },
                    }
                }
            }
        }
    </script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        html, body { overflow-x: hidden; max-width: 100%; }
        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050510;
            color: #F8FAFC;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Inter', system-ui, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            background-image: radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.1) 0%, transparent 60%);
        }

        /* Theme toggles — top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }

        .toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(139, 92, 246, 0.15);
            color: #22D3EE;
            transition: all 0.3s ease;
            border: 1px solid rgba(34, 211, 238, 0.3);
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .toggle-btn:hover {
            transform: scale(1.08);
            background: #8B5CF6;
            color: #FFFFFF;
        }

        /* Login Card */
        .login-card {
            background: rgba(11, 12, 27, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 36px;
            padding: 2.5rem 2.2rem 2.2rem;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        /* Input styling */
        .login-input {
            width: 100%;
            padding: 0.9rem 1.2rem 0.9rem 3rem;
            border-radius: 50px;
            border: 1.5px solid rgba(139, 92, 246, 0.3);
            background: #050510;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
        }

        .login-input:focus {
            outline: none;
            border-color: #22D3EE;
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
        }

        .login-input::placeholder {
            color: #64748B;
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .login-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #22D3EE;
            font-size: 1rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #FFFFFF;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .login-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* Primary button */
        .btn-neon {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: #FFFFFF;
            font-weight: 700;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.8);
        }

        /* Social login buttons */
        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 50px;
            border: 1.5px solid rgba(139, 92, 246, 0.3);
            background: #0B0C1B;
            color: #F8FAFC;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .social-btn:hover {
            background: rgba(34, 211, 238, 0.1);
            border-color: #22D3EE;
            transform: translateY(-2px);
        }

        .social-btn i {
            font-size: 1.1rem;
            color: #22D3EE;
        }

        /* Logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .welcome-title {
            font-family: 'Orbitron', serif;
            font-size: 1.85rem;
            font-weight: 800;
            color: #FFFFFF;
            margin-top: 1.5rem;
            margin-bottom: 0.25rem;
            text-align: center;
            line-height: 1.2;
        }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: #94A3B8;
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 400;
            opacity: 0.8;
        }

        /* Role selector styling */
        .role-selector {
            display: flex;
            gap: 0.5rem;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 50px;
            padding: 0.25rem;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .role-btn {
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
            color: #94A3B8;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .role-btn.active {
            background: #8B5CF6;
            color: #FFFFFF;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .role-btn:hover:not(.active) {
            background: rgba(139, 92, 246, 0.2);
            color: #FFFFFF;
        }

        /* RTL adjustments */
        [dir="rtl"] .login-input {
            padding: 0.9rem 3rem 0.9rem 1.2rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        [dir="rtl"] .fa-arrow-right, [dir="rtl"] .fa-chevron-right {
            transform: scaleX(-1);
        }

        /* Responsive */
        @media (max-height: 650px) {
            .login-card { padding: 1.2rem 1.5rem; transform: scale(0.92); transform-origin: center; }
            .logo-center { margin-bottom: 0.5rem; }
            .welcome-title { font-size: 1.4rem; margin-top: 0.5rem; }
            .welcome-subtitle { font-size: 0.8rem; margin-bottom: 0.5rem; }
            .login-input { padding: 0.65rem 1rem 0.65rem 2.5rem; font-size: 0.85rem; }
            .btn-neon { padding: 0.65rem 1.2rem; font-size: 0.9rem; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.8rem; }
        }

        @media (max-width: 380px) {
            .login-card { padding: 1.5rem 1.2rem; border-radius: 24px; }
            .welcome-title { font-size: 1.3rem; }
            .login-input { padding: 0.7rem 1rem 0.7rem 2.8rem; font-size: 0.85rem; }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; right: auto; }
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        .custom-checkbox {
            accent-color: #8B5CF6;
        }

        a {
            transition: all 0.2s ease;
        }

        /* Background decorative glow */
        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow-left {
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
    
        /* Light Theme Overrides */
        html:not(.dark) body {
            background-color: #F8FAFC !important;
            color: #0F172A !important;
            background-image: radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 60%) !important;
        }
        html:not(.dark) .login-card,
        html:not(.dark) .signup-card {
            background: rgba(255, 255, 255, 0.95) !important;
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.1) !important;
            border-color: rgba(139, 92, 246, 0.2) !important;
        }
        html:not(.dark) .welcome-title,
        html:not(.dark) .form-label,
        html:not(.dark) .strength-text,
        html:not(.dark) .terms-text {
            color: #0F172A !important;
        }
        html:not(.dark) .welcome-subtitle {
            color: #64748B !important;
        }
        html:not(.dark) .login-input,
        html:not(.dark) .signup-input {
            background: #F1F5F9 !important;
            border-color: rgba(139, 92, 246, 0.2) !important;
            color: #0F172A !important;
        }
        html:not(.dark) .login-input:focus,
        html:not(.dark) .signup-input:focus {
            background: #FFFFFF !important;
            border-color: #8B5CF6 !important;
        }
        html:not(.dark) .input-icon {
            color: #64748B !important;
        }
        html:not(.dark) .divider::before,
        html:not(.dark) .divider::after {
            border-color: #E2E8F0 !important;
        }
        html:not(.dark) .divider span {
            color: #94A3B8 !important;
        }
        html:not(.dark) .logo-center span.text-white {
            color: #0F172A !important;
        }
        html:not(.dark) .logo-center .fa-vr-cardboard {
            color: #FFFFFF !important;
        }
        html:not(.dark) .terms-link {
            color: #0891B2 !important;
        }
        html:not(.dark) .text-vr-muted {
            color: #64748B !important;
        }
        html:not(.dark) .bg-vr-panel {
            background-color: #FFFFFF !important;
        }
        html:not(.dark) .toggle-password {
            color: #475569 !important;
        }
        html:not(.dark) .btn-google,
        html:not(.dark) .btn-discord,
        html:not(.dark) .social-btn {
            background: #F1F5F9 !important;
            border-color: #CBD5E1 !important;
            color: #0F172A !important;
        }
        html:not(.dark) .social-btn:hover {
            background: #E0F2FE !important;
            border-color: #0891B2 !important;
        }
        html:not(.dark) .social-btn i {
            color: #0891B2 !important;
        }
        html:not(.dark) .toggle-btn {
            background: #F1F5F9 !important;
            color: #7C3AED !important;
            border-color: rgba(139, 92, 246, 0.2) !important;
        }

    </style>
</head>

<body>

    <!-- Background Glows -->
    <div class="bg-glow"></div>
    <div class="bg-glow-left"></div>

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            <i class="fas fa-exchange-alt"></i>
        </button>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="container-tight relative z-10">
        <div class="login-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center">
                <a href="index.html" class="flex items-center gap-3 group shrink-0 transition-transform duration-200 hover:scale-[1.02] inline-flex">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shrink-0" style="background:linear-gradient(135deg,#8B5CF6,#22D3EE);">
                        <i class="fas fa-vr-cardboard text-xl text-white"></i>
                    </div>
                    <div class="flex flex-col text-left leading-none">
                        <span class="font-display text-xl font-bold tracking-wider text-white">
                            VR <span class="text-vr-secondary">GALAXY</span>
                        </span>
                        <span class="text-[9px] tracking-widest uppercase font-semibold text-vr-muted mt-0.5">Gaming Lounge</span>
                    </div>
                </a>

                <h1 class="welcome-title">Welcome Back</h1>
                <p class="welcome-subtitle">Sign in to book your next session</p>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="space-y-5">

                <!-- Email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-vr-secondary input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" name="email" id="login-email" placeholder="Email address" required
                        class="login-input text-sm md:text-base">
                </div>

                <!-- Password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-vr-secondary input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" name="password" placeholder="Password" required
                        class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Remember + Forgot -->
                <div class="flex items-center justify-between text-xs md:text-sm">
                    <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-vr-muted">
                        <input type="checkbox" class="rounded border-vr-primary/30 custom-checkbox" checked>
                        <span class="ml-1 rtl:mr-1">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink"
                        class="text-vr-muted hover:text-vr-secondary font-semibold transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-neon mt-2">
                    Sign In <i class="fas fa-sign-in-alt ml-2"></i>
                </button>

                <!-- Divider -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-vr-primary/30"></div>
                    </div>
                    <div class="relative justify-center flex text-xs">
                        <span class="bg-vr-panel px-4 py-0.5 text-vr-muted rounded-full font-semibold">
                            or continue with
                        </span>
                    </div>
                </div>

            </form>

            <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
            <div class="mt-4">
                <div class="grid grid-cols-2 gap-3">
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('google')">
                        <i class="fab fa-google text-base"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('discord')">
                        <i class="fab fa-discord text-base"></i>
                        <span>Discord</span>
                    </button>
                </div>
            </div>

            <!-- ===== "NOT A MEMBER? SIGN UP" LINK ===== -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-vr-primary/30">
                <p class="text-sm md:text-base font-semibold text-vr-muted">
                    New to VR Galaxy?
                    <a href="signup.html" class="text-vr-secondary font-bold transition ml-1 rtl:mr-1 hover:underline">
                        Create Account
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Theme Toggle (Design is primarily dark, so we just toggle a class)
            const themeBtn = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                const moon = themeBtn?.querySelector('.fa-moon');
                const sun = themeBtn?.querySelector('.fa-sun');
                if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
                else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            // Default to dark mode for VR theme if no preference
            const savedTheme = localStorage.getItem('theme');
            setTheme(savedTheme ? savedTheme === 'dark' : true);

            // 2. RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
                localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
                localStorage.setItem('direction', isRTL ? 'rtl' : 'ltr');
            }

            const savedDir = localStorage.getItem('direction') || localStorage.getItem('dir');
            setRTL(savedDir === 'rtl');

            if (rtlBtn) {
                rtlBtn.addEventListener('click', () => {
                    setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
                });
            }

            // 3. Password Toggle
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-eye-slash');
                            icon.classList.toggle('fa-eye');
                        }
                    }
                });
            });

            // 4. Social login placeholder
            window.socialLogin = function(provider) {
                alert(`Sign in with ${provider} — coming soon. For now, use the demo form.`);
            };

            // 5. Login form submission — redirect to customer dashboard
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                window.location.href = 'customer.html';
            });

            // 6. Forgot password link
            document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('A password reset link will be sent to your registered email.');
            });
        });
    </script>

</body>
</html>
